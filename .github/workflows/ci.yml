name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled too, so adding the new-dependency label reruns the guard
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No co-author or tool credit in commit messages
        run: |
          ! git log --format='%an %ae%n%cn %ce%n%B' HEAD | grep -niE 'co-authored-by|generated with|noreply@anthropic|claude\.com/claude-code'
      - name: No API keys in the repository
        run: |
          ! git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk-or-v1-[a-f0-9]{20,}'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=custom_components/llm_agent --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the size and dependency checks below compare with origin/main
          fetch-depth: 0
      - name: No new dependency without the new-dependency label
        # Every package is code that runs in someone's Home Assistant, and the panel's
        # dependencies end up in the bundle every user downloads. So adding, removing or
        # changing one is a decision someone makes on purpose, marked by the label, not
        # a habit that slips in with a feature. Compared as parsed JSON, so reformatting
        # package.json or manifest.json does not trip it.
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'new-dependency') }}
        run: |
          deps() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(json.dumps({k: d.get(k) for k in sys.argv[1:]}, sort_keys=True, indent=1))' "$@"; }
          changed=""
          for spec in "frontend/package.json dependencies devDependencies" "custom_components/llm_agent/manifest.json requirements"; do
            set -- $spec
            file=$1
            shift
            was=$(git show "origin/main:$file" | deps "$@")
            now=$(deps "$@" < "$file")
            if [ "$was" != "$now" ]; then
              echo "$file: $* differ from main:"
              diff <(echo "$was") <(echo "$now") || true
              changed=1
            fi
          done
          if [ -n "$changed" ] && [ "$LABELED" != "true" ]; then
            echo "Dependencies changed. If that is intended, add the new-dependency label to the PR."
            exit 1
          fi
          if [ -n "$changed" ]; then echo "dependencies: changed, labeled new-dependency"; else echo "dependencies: unchanged from main"; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed bundle matches the source
        # status as well as diff: a new build output that was never committed is
        # untracked, and git diff passes over untracked files
        run: |
          git diff --exit-code -- custom_components/llm_agent/www
          test -z "$(git status --porcelain -- custom_components/llm_agent/www)" || { git status --short; exit 1; }
      - name: Panel grows by at most 8 KiB in one change
        # Size matters here only when something big slips in: an accidentally bundled
        # library adds 8 kB or more gzipped, while a feature adds one or two. So the
        # check is how much this change grows the panel against main's committed copy,
        # not an absolute budget that every feature has to raise. On main itself the
        # two are the same file and the growth is 0.
        run: |
          size=$(gzip -9c custom_components/llm_agent/www/llm-agent-panel.js | wc -c)
          base=$(git show origin/main:custom_components/llm_agent/www/llm-agent-panel.js | gzip -9c | wc -c)
          delta=$((size - base))
          echo "panel: $size bytes gzipped, main: $base, growth: $delta (limit 8192)"
          test "$delta" -le 8192
      - name: Floating chat loader stays within its size budget (6 kB gzipped)
        run: |
          size=$(gzip -9c custom_components/llm_agent/www/llm-agent-float.js | wc -c)
          echo "loader: $size bytes gzipped"
          # HA loads this file on every page of every dashboard, chat or not, so it must
          # stay a button; the window and the panel load only when it is clicked.
          test "$size" -le 6144

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: SHOTS=/tmp/shots e2e/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: /tmp/shots
          if-no-files-found: ignore
