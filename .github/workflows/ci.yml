name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No co-author or tool credit in commit messages
        run: |
          ! git log --format='%an %ae%n%cn %ce%n%B' HEAD | grep -niE 'co-authored-by|generated with|noreply@anthropic|claude\.com/claude-code'
      - name: No API keys in the repository
        run: |
          ! git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk-or-v1-[a-f0-9]{20,}'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=custom_components/llm_agent --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed bundle matches the source
        # status as well as diff: a new build output that was never committed is
        # untracked, and git diff passes over untracked files
        run: |
          git diff --exit-code -- custom_components/llm_agent/www
          test -z "$(git status --porcelain -- custom_components/llm_agent/www)" || { git status --short; exit 1; }
      - name: Panel stays within its size budget (111 KiB gzipped)
        run: |
          size=$(gzip -9c custom_components/llm_agent/www/llm-agent-panel.js | wc -c)
          echo "panel: $size bytes gzipped"
          # The budget keeps 8 KiB of headroom over the measured panel on purpose: an
          # accidentally bundled library adds 8 kB or more and fails this step, while
          # normal feature growth fits. When feature growth leaves under 2 KiB of
          # headroom, re-base it: the measured size plus 8 KiB, rounded up to the next
          # KiB, with the measurement written here.
          # Last re-based 2026-11-21: 104565 bytes measured (per-chat modes, model search,
          # turn log download; main was 101979), + 8192 = 112757, rounded up to 113664.
          test "$size" -le 113664
      - name: Floating chat loader stays within its size budget (6 kB gzipped)
        run: |
          size=$(gzip -9c custom_components/llm_agent/www/llm-agent-float.js | wc -c)
          echo "loader: $size bytes gzipped"
          # HA loads this file on every page of every dashboard, chat or not, so it must
          # stay a button; the window and the panel load only when it is clicked.
          test "$size" -le 6144

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: SHOTS=/tmp/shots e2e/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: /tmp/shots
          if-no-files-found: ignore
